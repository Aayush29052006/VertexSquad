<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem('cn_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — CareerNexus</title>
<link rel="icon" type="image/png" href="../assets/logos/careernexus-logo.png" />
<link rel="stylesheet" href="../css/global.css?v=20260909b" />
<link rel="stylesheet" href="../css/components.css?v=20260909b" />

<link rel="stylesheet" href="../css/dashboard.css?v=20260909b" />
<link rel="stylesheet" href="../css/responsive.css?v=20260909b" />
<style>
  /* The admin panel uses the full content width — no 1400px cap. */
  .main-content .page-body { max-width: none; }

  .admin-tabs { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-5); border-bottom: 1px solid var(--border); }
  .admin-tab { background: none; border: none; padding: var(--space-3) var(--space-4); font-size: 0.92rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  /* The data table, toolbar, skill-gap bars and modal now live in
     platform.css — the recruiter, institution and verification pages use
     the same primitives, so there is one copy rather than four. */
</style>
</head>
<body>
<div class="app-shell" id="appShell"></div>

<script src="../js/config.js?v=20260909b"></script>
<script src="../js/mock-data.js?v=20260909b"></script>
<script src="../js/api.js?v=20260909b"></script>
<script src="../js/ui.js?v=20260909b"></script>
<script src="../js/theme.js?v=20260909b"></script>
<script src="../js/admin.js?v=20260909b"></script>
</body>
</html>
